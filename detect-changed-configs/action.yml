name: "Detect Changed Config Files"
description: >
  Detects changed YAML config files compared to main (or since the previous tag), or uses a
  manually provided comma-separated list (workflow_dispatch override). Looks in data_products/
  for create-data-product and in base_infra/ for create-basic-infra.
  The caller must check out the repository with fetch-depth: 0 before using this action.

inputs:
  action:
    description: "Genesis CLI action: create-data-product (looks in data_products/) or create-basic-infra (looks in base_infra/)"
    required: false
    default: "create-data-product"
  event_name:
    description: "The GitHub event name (github.event_name)"
    required: true
  input_config_files:
    description: >
      Comma-separated config file names relative to the config directory
      (e.g. first_data_product.yml,subdir/second.yml).
      Only used when event_name is workflow_dispatch.
    required: false
    default: ""
  ref_type:
    description: "The GitHub ref type (github.ref_type): branch or tag"
    required: false
    default: ""
  ref_name:
    description: "The GitHub ref name (github.ref_name)"
    required: false
    default: ""

outputs:
  config_files:
    description: "JSON array of config file paths, prefixed with data_products/ or base_infra/"
    value: ${{ steps.detect.outputs.config_files }}

runs:
  using: composite
  steps:
    - name: Detect changed config files
      id: detect
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
        EVENT_NAME: ${{ inputs.event_name }}
        INPUT_CONFIG_FILES: ${{ inputs.input_config_files }}
        REF_TYPE: ${{ inputs.ref_type }}
        REF_NAME: ${{ inputs.ref_name }}
      run: |
        case "$ACTION" in
          create-data-product) dir="data_products" ;;
          create-basic-infra)  dir="base_infra" ;;
          *)
            echo "ERROR: Unsupported action '$ACTION' (expected create-data-product or create-basic-infra)." >&2
            exit 1
            ;;
        esac

        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          if [[ -z "$INPUT_CONFIG_FILES" ]]; then
            echo "ERROR: INPUT_CONFIG_FILES must be provided for workflow_dispatch events." >&2
            exit 1
          fi
          invalid=$(echo "$INPUT_CONFIG_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | grep -v '\.yml$' || true)
          if [[ -n "$invalid" ]]; then
            echo "ERROR: All config files must have a .yml suffix. Invalid files: $invalid" >&2
            exit 1
          fi
          files=$(echo "$INPUT_CONFIG_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sed "s|^|$dir/|" | jq -R . | jq -sc .)
        elif [[ "$REF_TYPE" == "tag" ]]; then
          # Tag (prod release): changes since the previous tag, or everything if this is the first tag.
          if prev_tag=$(git describe --tags --abbrev=0 "${REF_NAME}^" 2>/dev/null); then
            echo "INFO: Diffing against previous tag $prev_tag"
            files=$(git diff --name-only "$prev_tag" HEAD -- "$dir/" | { grep '\.yml$' || true; } | jq -R . | jq -sc .)
          else
            echo "INFO: No previous tag found, selecting all $dir configs"
            files=$(git ls-files "$dir/*.yml" "$dir/**/*.yml" | sort -u | jq -R . | jq -sc .)
          fi
        else
          files=$(git diff --name-only origin/main HEAD -- "$dir/" | { grep '\.yml$' || true; } | jq -R . | jq -sc .)
        fi
        echo "config_files=$files" >> "$GITHUB_OUTPUT"
        echo "INFO: Detected config files: $files"
