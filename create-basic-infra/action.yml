name: 'Genesis – Create Basic Infrastructure'
description: >
  Renders Terraform files for a new organisation from a genesis_config.yml
  using the genesis-api Docker image hosted on GHCR.
  The calling repository must be listed in the genesis-api package access list
  on GHCR, and the workflow must declare `permissions: packages: read`.

inputs:
  token:
    description: >
      GitHub token with packages:read permission.
      Defaults to the calling repository GITHUB_TOKEN. The repository this
      token belongs to must be added to the genesis-api GHCR package access
      list by your Genesis administrator.
    required: false
    default: ${{ github.token }}

  basic_infra_yaml_file:
    description: >
      Path to the genesis basic infra config YAML file, relative to the repository root
      (e.g. "genesis_config.yml").
    required: true

  version:
    description: >
      genesis-api image version to use (e.g. "1.2.3" or "1.2.3-rc.1").
      Defaults to "latest" (most recent stable release).
    required: true

  base_infra_terraform_dir:
    default: "base_infra_terraform"
    description: >
      Directory where the generated Terraform files will be stored, relative to the repository root.
      Defaults to "base_infra_terraform".
    required: false

  terraform_version:
    description: >
      Terraform version constraint to use for the "Setup Terraform" step.
    required: false
    default: "1.14.0"

  debug:
    description: >
      If true, the generated Terraform files will be uploaded as a workflow artifact for debugging purposes.
      Defaults to false.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Create terraform directory
      shell: bash
      run: mkdir -p "${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}"

    - name: Generate Terraform files
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          "ghcr.io/aalloul/genesis-api:${{ inputs.version }}" \
          create-basic-infra \
          --cfg "${{ github.workspace }}/${{ inputs.basic_infra_yaml_file }}" \
          --output-dir "${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}"

    - name: Store generated Terraform files as an artifact
      uses: actions/upload-artifact@v7
      if: ${{ inputs.debug == 'true' }}
      with:
        name: basic-infra-terraform
        path: '${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Init & validate
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}
      run: terraform init -no-color && terraform validate -no-color

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}
      run: terraform plan -no-color -out=tfplan

    - name: Terraform apply
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.base_infra_terraform_dir }}
      run: terraform apply -no-color tfplan
