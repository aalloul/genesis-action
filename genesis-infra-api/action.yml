name: 'Genesis – Create Basic Infrastructure'
description: >
  Renders Terraform files for a new organisation from a genesis_config.yml
  using the genesis-api Docker image hosted on GHCR.
  The calling repository must be listed in the genesis-api package access list
  on GHCR, and the workflow must declare `permissions: packages: read`.

inputs:
  action:
    description: >
      Action to perform. Only "create-basic-infra" and "create-data-product" are supported for now.
    required: true

  environment:
    description: >
      Deployment environment (e.g. "dev", "staging", "prod").
    required: true
  
  token:
    description: >
      GitHub token with packages:read permission.
      Defaults to the calling repository GITHUB_TOKEN. The repository this
      token belongs to must be added to the genesis-api GHCR package access
      list by your Genesis administrator.
    required: false
    default: ${{ github.token }}

  username:
    description: >
      GitHub username associated with the provided token.
      Defaults to the calling repository GITHUB_ACTOR.
    required: false
    default: ${{ github.actor }}

  config_yml_file:
    description: >
      Path to the genesis config YAML file, relative to the repository root.
    required: true

  genesis_version:
    description: >
      genesis-api image version to use (e.g. "1.2.3" or "1.2.3-rc.1").
      Defaults to "latest" (most recent stable release).
    required: true

  terraform_output_dir:
    default: "terraform_output_dir"
    description: >
      Directory where the generated Terraform files will be stored, relative to the repository root.
      Defaults to "terraform_output_dir".
    required: false

  terraform_version:
    description: >
      Terraform version constraint to use for the "Setup Terraform" step.
    required: false
    default: "1.14.8"

  debug:
    description: >
      If true, the generated Terraform files will be uploaded as a workflow artifact for debugging purposes.
      Defaults to false.
    required: false
    default: "false"

  run_terraform_apply:
    description: >
      If true, the workflow will run `terraform apply` after `terraform plan`.
      Defaults to true as this is meant as a debugging feature.
    required: false
    default: "true"

  github_repository_owner:
    description: >
      GitHub repository owner (user or organization) of the calling repository.
    required: true

  folder_id:
    description: GCP folder ID under which the project will be created.
    required: true

  cloud_provider:
    description: Cloud provider to use (e.g. "gcp").
    required: true

  gcp_region:
    description: GCP region (e.g. "europe-west1").
    required: true

  gcp_zone:
    description: GCP zone (e.g. "europe-west1-b").
    required: true

  organization_short_name:
    description: Short name of the organisation, used as a prefix for resource names.
    required: true

  seed_project_id:
    description: GCP project ID of the seed project.
    required: true

  seed_service_account:
    description: Email of the seed service account used to create resources.
    required: true

  billing_account:
    description: GCP billing account ID to attach to the new project.
    required: true

  gcp_seed_project:
    description: GCP seed project (used for quota / impersonation).
    required: true

  gcp_service_account:
    description: GCP service account email for Terraform operations.
    required: true

  gcp_workload_identity_provider:
    description: Workload Identity Federation provider resource name.
    required: true

  vpcsc_perimeter_name:
    description: Name of the VPC Service Controls perimeter to add the new project to.
    required: true

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Create terraform directory
      shell: bash
      run: mkdir -p "${{ github.workspace }}/${{ inputs.terraform_output_dir }}"

    - name: Create env file for Docker
      shell: bash
      run: |
        cat <<EOF > "${{ runner.temp }}/genesis.env"
        FOLDER_ID=${{ inputs.folder_id }}
        CLOUD_PROVIDER=${{ inputs.cloud_provider }}
        GCP_REGION=${{ inputs.gcp_region }}
        GCP_ZONE=${{ inputs.gcp_zone }}
        ORGANIZATION_SHORT_NAME=${{ inputs.organization_short_name }}
        SEED_PROJECT_ID=${{ inputs.seed_project_id }}
        SEED_SERVICE_ACCOUNT=${{ inputs.seed_service_account }}
        BILLING_ACCOUNT=${{ inputs.billing_account }}
        GCP_SEED_PROJECT=${{ inputs.gcp_seed_project }}
        GCP_SERVICE_ACCOUNT=${{ inputs.gcp_service_account }}
        GCP_WORKLOAD_IDENTITY_PROVIDER=${{ inputs.gcp_workload_identity_provider }}
        GITHUB_REPOSITORY_OWNER=${{ inputs.github_repository_owner }}
        VPCSC_PERIMETER_NAME=${{ inputs.vpcsc_perimeter_name }}
        ENVIRONMENT=${{ inputs.environment }}
        EOF

    - name: Generate Terraform files
      shell: bash
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v "${{ github.workspace }}:/workspace" \
          --env-file "${{ runner.temp }}/genesis.env" \
          "ghcr.io/aalloul/genesis-api:${{ inputs.genesis_version }}" \
          ${{ inputs.action }} \
          --cfg "/workspace/${{ inputs.config_yml_file }}" \
          --output-dir "/workspace/${{ inputs.terraform_output_dir }}"

    - name: Store generated Terraform files as an artifact
      uses: actions/upload-artifact@v7
      if: ${{ inputs.debug == 'true' }}
      with:
        name: basic-infra-terraform
        path: '${{ github.workspace }}/${{ inputs.terraform_output_dir }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Init & validate
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      run: |
        terraform init && terraform validate -no-color

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      run: terraform plan -out=tfplan

    - name: Terraform apply
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      if: ${{ inputs.run_terraform_apply == 'true' }}
      run: terraform apply tfplan
