name: 'Genesis – Create Basic Infrastructure'
description: >
  Renders Terraform files for a new organisation from a genesis_config.yml
  using the genesis-api Docker image hosted on GHCR.
  The calling repository must be listed in the genesis-api package access list
  on GHCR, and the workflow must declare `permissions: packages: read`.

inputs:
  action:
    description: >
      Action to perform. One of "create-basic-infra", "create-data-product" or "provision-resources".
    required: true

  config_yml_file:
    description: >
      Path to the genesis config YAML file, relative to the repository root.
    required: true

  genesis_version:
    description: >
      genesis-api image version to use (e.g. "1.2.3" or "1.2.3-rc.1").
    required: true

  debug:
    description: >
      If true, the generated Terraform files will be uploaded as a workflow artifact for debugging purposes.
      Defaults to false.
    required: false
    default: "false"

  run_terraform_apply:
    description: >
      If true, the workflow will run `terraform apply` after `terraform plan`.
      Defaults to true as this is meant as a debugging feature.
    required: false
    default: "true"

  env_vars:
    description: >
      JSON object of non-secret configuration values, e.g. `toJSON(vars)` (don't forget to add $ and double {).
      See the README for the full list of keys this action reads.
    required: false
    default: "{}"

  secrets:
    description: >
      JSON object of sensitive configuration values, e.g. `toJSON(secrets)`  (don't forget to add $ and double {).
      Values are masked in logs. Takes precedence over env_vars on key collisions.
      See the README for the full list of keys this action reads.
    required: false
    default: "{}"

  github_repository_owner:
    description: >
      The owner of the repository where this action is being run. This is used to resolve the GITHUB_REPO_NAME
      if it is not provided in env_vars or secrets. Defaults to the owner of the repository where this action is run.
    required: false
    default: ${{ github.repository_owner }}

  github_repository_owner_id:
    description: >
      The ID of the owner of the repository where this action is being run. This is used to resolve the GITHUB_REPO_NAME
      if it is not provided in env_vars or secrets. Defaults to the ID of the owner of the repository where this action is run.
    required: false
    default: ${{ github.repository_owner_id }}

runs:
  using: composite
  steps:
    - name: Resolve configuration
      shell: bash
      env:
        ENV_VARS_JSON: ${{ inputs.env_vars }}
        SECRETS_JSON: ${{ inputs.secrets }}
        DEFAULT_GENESIS_API_ACCESS: "someVal"
        DEFAULT_USERNAME: ${{ github.actor }}
        DEFAULT_TERRAFORM_OUTPUT_DIR: ${{ github.actor }}
        DEFAULT_TERRAFORM_VERSION: 1.14.8
      run: |
        set -euo pipefail
        
        echo "GITHUB_REPOSITORY_OWNER=${{ inputs.github_repository_owner }}"

        # Mask every secret value before anything else can print it.
        while IFS= read -r value; do
          [[ -n "$value" ]] && echo "::add-mask::$value"
        done < <(jq -r '.[] | select(. != null)' <<< "$SECRETS_JSON")

        MERGED=$(jq -n --argjson env_vars "$ENV_VARS_JSON" --argjson secrets "$SECRETS_JSON" '$env_vars * $secrets')
        get() {
          jq -r --arg k "$1" '.[$k] // empty' <<< "$MERGED"
        }

        # These keys are read from env_vars/secrets by name if present, and default to an
        # empty string otherwise. Not every key is meaningful for every `action` value (e.g.
        # org/folder-level keys are irrelevant for `provision-resources`), so nothing here is
        # hard-validated - genesis-api itself is the source of truth for what a given action needs.
        known_keys=(
          FOLDER_ID CLOUD_PROVIDER GCP_REGION GCP_ZONE ORGANIZATION_SHORT_NAME
          GCP_PROJECT_ID IMPERSONATE_SERVICE_ACCOUNT BILLING_ACCOUNT GCP_SEED_PROJECT SEED_PROJECT_ID
          GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER VPCSC_PERIMETER_NAME ENVIRONMENT TERRAFORM_BUCKET 
          ORGANIZATION_ID REPO_ADMIN_TOKEN GENESIS_API_ACCESS ORGANIZATION_NAME
        )
        for key in "${known_keys[@]}"; do
          declare "$key=$(get "$key")"
        done

        GENESIS_API_ACCESS="$(get GENESIS_API_ACCESS)"; GENESIS_API_ACCESS="${GENESIS_API_ACCESS:-$DEFAULT_GENESIS_API_ACCESS}"
        USERNAME="$(get USERNAME)"; USERNAME="${USERNAME:-$DEFAULT_USERNAME}"
        GITHUB_REPO_NAME="$(get GITHUB_REPO_NAME)"
        TERRAFORM_OUTPUT_DIR="$(get TERRAFORM_OUTPUT_DIR)"; TERRAFORM_OUTPUT_DIR="${TERRAFORM_OUTPUT_DIR:-$DEFAULT_TERRAFORM_OUTPUT_DIR}"
        TERRAFORM_VERSION="$(get TERRAFORM_VERSION)"; TERRAFORM_VERSION="${TERRAFORM_VERSION:-$DEFAULT_TERRAFORM_VERSION}"
        optional_keys=(GENESIS_API_ACCESS USERNAME GITHUB_REPO_NAME TERRAFORM_OUTPUT_DIR TERRAFORM_VERSION)

        # Write every resolved key to $GITHUB_ENV (heredoc form, safe for values with special characters)
        # so later steps can read them via the `env` context.
        for key in "${known_keys[@]}" "${optional_keys[@]}"; do
          delim="GHA_EOF_${key}_${RANDOM}${RANDOM}"
          {
            echo "$key<<$delim"
            echo "${!key}"
            echo "$delim"
          } >> "$GITHUB_ENV"
        done

        mkdir -p "${{ github.workspace }}/$TERRAFORM_OUTPUT_DIR"

        # The genesis-api container only needs the actual GCP/org configuration,
        # not the action's own plumbing (tokens, directories, versions).
        jq -r 'del(.GENESIS_API_ACCESS, .USERNAME, .REPO_ADMIN_TOKEN, .TERRAFORM_OUTPUT_DIR, .TERRAFORM_VERSION, .GITHUB_REPO_NAME)
               | to_entries[] | "\(.key)=\(.value)"' <<< "$MERGED" > "${{ runner.temp }}/genesis.env"
        
        echo "GITHUB_REPOSITORY_OWNER=${{ inputs.github_repository_owner }}" >> "${{ runner.temp }}/genesis.env"
        echo "GITHUB_REPOSITORY_OWNER_ID=${{ inputs.github_repository_owner_id }}" >> "${{ runner.temp }}/genesis.env"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ env.USERNAME }}
        password: ${{ env.GENESIS_API_ACCESS }}

    - name: Generate Terraform files
      shell: bash
      run: |
        echo "============= print genesis.env ============="
        echo "genesis.env contents:"
        cat "${{ runner.temp }}/genesis.env"
        echo "============= run genesis-api ============="
        
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v "${{ github.workspace }}:/workspace" \
          --env-file "${{ runner.temp }}/genesis.env" \
          "ghcr.io/aalloul/genesis-api:${{ inputs.genesis_version }}" \
          ${{ inputs.action }} \
          --cfg "/workspace/${{ inputs.config_yml_file }}" \
          --output-dir "/workspace/${{ env.TERRAFORM_OUTPUT_DIR }}"

    - name: Store generated Terraform files as an artifact
      uses: actions/upload-artifact@v7
      if: ${{ inputs.debug == 'true' }}
      with:
        name: basic-infra-terraform
        path: '${{ github.workspace }}/${{ env.TERRAFORM_OUTPUT_DIR }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Init & validate
      shell: bash
      working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_OUTPUT_DIR }}
      run: |
        terraform init && terraform validate -no-color

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_OUTPUT_DIR }}
      env:
        GITHUB_TOKEN: ${{ env.REPO_ADMIN_TOKEN }}
        GITHUB_OWNER: ${{ github.repository_owner }}
      run: terraform plan -out=tfplan

    - name: Terraform apply
      shell: bash
      working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_OUTPUT_DIR }}
      if: ${{ inputs.run_terraform_apply == 'true' }}
      env:
        GITHUB_TOKEN: ${{ env.REPO_ADMIN_TOKEN }}
        GITHUB_OWNER: ${{ github.repository_owner }}
      run: terraform apply tfplan

    - name: Store Terraform outputs as GitHub variables and secrets
      shell: bash
      if: ${{ inputs.run_terraform_apply == 'true' }}
      working-directory: ${{ github.workspace }}/${{ env.TERRAFORM_OUTPUT_DIR }}
      env:
        GH_TOKEN: ${{ env.REPO_ADMIN_TOKEN }}
        ENVIRONMENT: ${{ env.ENVIRONMENT }}
        REPO: ${{ env.GITHUB_REPO_NAME }}
      run: |
        if [[ '${{ inputs.action }}' == 'create-basic-infra' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/base_infra_mappings.json
        elif [[ '${{ inputs.action }}' == 'create-data-product' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/data_product_creation_mappings.json
        elif [[ '${{ inputs.action }}' == 'provision-resources' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/data_product_provision_resources_mappings.json
        else
          echo "Error: no mapping file for action: ${{ inputs.action }}" >&2
          exit 1
        fi
        echo "Using mapping file: $MAPPING_FILE"

        if [[ -z "$REPO" ]]; then
          REPO=$(terraform output -raw github_repo_name)
        fi
        export REPO

        bash "${{ github.action_path }}/store_tf_outputs.sh"
