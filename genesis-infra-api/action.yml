name: 'Genesis – Create Basic Infrastructure'
description: >
  Renders Terraform files for a new organisation from a genesis_config.yml
  using the genesis-api Docker image hosted on GHCR.
  The calling repository must be listed in the genesis-api package access list
  on GHCR, and the workflow must declare `permissions: packages: read`.

inputs:
  action:
    description: >
      Action to perform. Only "create-basic-infra" and "create-data-product" are supported for now.
    required: true

  environment:
    description: >
      Deployment environment (e.g. "dev", "staging", "prod").
    required: true
  
  ghcr_token:
    description: >
      GitHub token with packages:read permission.
      Defaults to the calling repository GITHUB_TOKEN. The repository this
      token belongs to must be added to the genesis-api GHCR package access
      list by your Genesis administrator.
    required: false
    default: ${{ github.token }}

  repo_admin_token:
    description: >
      GitHub personal access token with write permissions on secrets & variables,
      and repo scope (required by the Terraform GitHub provider to create and
      configure repositories).
    required: true

  username:
    description: >
      GitHub username associated with the provided token.
      Defaults to the calling repository GITHUB_ACTOR.
    required: false
    default: ${{ github.actor }}

  github_repo_name:
     description: >
       The name of the repo where the environment variables & secrets will be stored.
       If omitted, the value is read from the Terraform output key "github_repo_name".
     required: false

  config_yml_file:
    description: >
      Path to the genesis config YAML file, relative to the repository root.
    required: true

  genesis_version:
    description: >
      genesis-api image version to use (e.g. "1.2.3" or "1.2.3-rc.1").
      Defaults to "latest" (most recent stable release).
    required: true

  terraform_bucket:
    description: >
      GCS bucket to use for Terraform remote state. Must be in the same project as the generated infrastructure.
      Defaults to "genesis-terraform-state".
    required: true

  terraform_output_dir:
    default: "terraform_output_dir"
    description: >
      Directory where the generated Terraform files will be stored, relative to the repository root.
      Defaults to "terraform_output_dir".
    required: false

  terraform_version:
    description: >
      Terraform version constraint to use for the "Setup Terraform" step.
    required: false
    default: "1.14.8"

  debug:
    description: >
      If true, the generated Terraform files will be uploaded as a workflow artifact for debugging purposes.
      Defaults to false.
    required: false
    default: "false"

  run_terraform_apply:
    description: >
      If true, the workflow will run `terraform apply` after `terraform plan`.
      Defaults to true as this is meant as a debugging feature.
    required: false
    default: "true"

  github_repository_owner:
    description: >
      GitHub repository owner (user or organization) of the calling repository.
    required: true

  folder_id:
    description: GCP folder ID under which the project will be created.
    required: true

  cloud_provider:
    description: Cloud provider to use (e.g. "gcp").
    required: true

  gcp_region:
    description: GCP region (e.g. "europe-west1").
    required: true

  gcp_zone:
    description: GCP zone (e.g. "europe-west1-b").
    required: true

  organization_short_name:
    description: Short name of the organisation, used as a prefix for resource names.
    required: true

  organization_name:
    description: Full name of the organisation, used for display purposes.
    required: true

  organization_id:
    description: GCP organization ID where the project will be created.
    required: true

  gcp_project_id:
    description: The GCP project ID we want to deploy to.
    required: true

  impersonate_service_account:
    description: Email of the SA to impersonate for Terraform operations (must have the required permissions on the project).
    required: true

  billing_account:
    description: GCP billing account ID to attach to the new project.
    required: true

  gcp_seed_project:
    description: GCP seed project (used for quota / impersonation).
    required: true

  gcp_service_account:
    description: GCP service account email for Terraform operations.
    required: true

  gcp_workload_identity_provider:
    description: Workload Identity Federation provider resource name.
    required: true

  vpcsc_perimeter_name:
    description: Name of the VPC Service Controls perimeter to add the new project to.
    required: true

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.ghcr_token }}

    - name: Create terraform directory
      shell: bash
      run: mkdir -p "${{ github.workspace }}/${{ inputs.terraform_output_dir }}"

    - name: Create env file for Docker
      shell: bash
      run: |
        echo "repository_owner_id=${{ github.repository_owner_id }}"
        {
          echo "FOLDER_ID=${{ inputs.folder_id }}"
          echo "CLOUD_PROVIDER=${{ inputs.cloud_provider }}"
          echo "GCP_REGION=${{ inputs.gcp_region }}"
          echo "GCP_ZONE=${{ inputs.gcp_zone }}"
          echo "ORGANIZATION_SHORT_NAME=${{ inputs.organization_short_name }}"
          echo "GCP_PROJECT_ID=${{ inputs.gcp_project_id }}"
          echo "IMPERSONATE_SERVICE_ACCOUNT=${{ inputs.impersonate_service_account }}"
          echo "BILLING_ACCOUNT=${{ inputs.billing_account }}"
          echo "GCP_SEED_PROJECT=${{ inputs.gcp_seed_project }}"
          echo "GCP_SERVICE_ACCOUNT=${{ inputs.gcp_service_account }}"
          echo "GCP_WORKLOAD_IDENTITY_PROVIDER=${{ inputs.gcp_workload_identity_provider }}"
          echo "GITHUB_REPOSITORY_OWNER=${{ inputs.github_repository_owner }}"
          echo "VPCSC_PERIMETER_NAME=${{ inputs.vpcsc_perimeter_name }}"
          echo "ENVIRONMENT=${{ inputs.environment }}"
          echo "TERRAFORM_BUCKET=${{ inputs.terraform_bucket }}"
          echo "ORGANIZATION_NAME=${{ inputs.organization_name }}"
          echo "ORGANIZATION_ID=${{ inputs.organization_id }}"
          echo "GITHUB_REPOSITORY_OWNER_ID=${{ github.repository_owner_id }}"
        } > "${{ runner.temp }}/genesis.env"

    - name: Generate Terraform files
      shell: bash
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v "${{ github.workspace }}:/workspace" \
          --env-file "${{ runner.temp }}/genesis.env" \
          "ghcr.io/aalloul/genesis-api:${{ inputs.genesis_version }}" \
          ${{ inputs.action }} \
          --cfg "/workspace/${{ inputs.config_yml_file }}" \
          --output-dir "/workspace/${{ inputs.terraform_output_dir }}"


    - name: Store generated Terraform files as an artifact
      uses: actions/upload-artifact@v7
      if: ${{ inputs.debug == 'true' }}
      with:
        name: basic-infra-terraform
        path: '${{ github.workspace }}/${{ inputs.terraform_output_dir }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Terraform Init & validate
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      run: |
        terraform init && terraform validate -no-color

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      env:
        GITHUB_TOKEN: ${{ inputs.repo_admin_token }}
        GITHUB_OWNER: ${{ github.repository_owner }}
      run: terraform plan -out=tfplan

    - name: Terraform apply
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      if: ${{ inputs.run_terraform_apply == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.repo_admin_token }}
        GITHUB_OWNER: ${{ github.repository_owner }}
      run: terraform apply tfplan

    - name: Store Terraform outputs as GitHub variables and secrets
      shell: bash
      if: ${{ inputs.run_terraform_apply == 'true' }}
      working-directory: ${{ github.workspace }}/${{ inputs.terraform_output_dir }}
      env:
        GH_TOKEN: ${{ inputs.repo_admin_token }}
        ENVIRONMENT: ${{ inputs.environment }}
        REPO: ${{ inputs.github_repo_name }}
      run: |
        if [[ '${{ inputs.action }}' == 'create-basic-infra' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/base_infra_mappings.json
        elif [[ '${{ inputs.action }}' == 'create-data-product' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/data_product_creation_mappings.json
        elif [[ '${{ inputs.action }}' == 'provision-resources' ]]; then
          export MAPPING_FILE=${{ github.action_path }}/data_product_provision_resources_mappings.json
        else
          echo "Error: no mapping file for action: ${{ inputs.action }}" >&2
          exit 1
        fi
        echo "Using mapping file: $MAPPING_FILE"
        
        if [[ -z "$REPO" ]]; then
          REPO=$(terraform output -raw github_repo_name)
        fi
        export REPO

        bash "${{ github.action_path }}/store_tf_outputs.sh"
