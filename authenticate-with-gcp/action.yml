name: 'Genesis – Authenticate with GCP'
description: >
  Authenticates the workflow with Google Cloud Platform using Workload Identity Federation (WIF). 
  The resulting credentials are available to all subsequent steps in the job.

inputs:
  workload_identity_provider:
    description: >
      The full resource name of the Workload Identity Provider to use for
      authentication (e.g. "projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider").
    required: true

  gcp_project:
    description: >
      The GCP project ID to authenticate against (e.g. "my-gcp-project-id").
    required: true

  service_account:
    description: >
      The email address of the GCP service account to impersonate
      (e.g. "my-sa@my-project.iam.gserviceaccount.com").
    required: false
    default: ""

  token_format:
    description: >
      The format of the generated token. Use "access_token" for most GCP API
      calls and Terraform. Use "id_token" when calling Cloud Run or other
      services that require an OIDC ID token.
    required: false
    default: ""

  audience:
    description: >
      The audience for the generated ID token. Only relevant when
      token_format is "id_token". Defaults to the calling URL of the service
      being invoked.
    required: false
    default: ""

outputs:
  access_token:
    description: >
      The GCP access token. Only populated when token_format is "access_token".
    value: ${{ steps.auth.outputs.access_token }}

runs:
  using: composite
  steps:
    - name: Direct WIF auth
      id: direct_wif_auth
      uses: google-github-actions/auth@v2
      if: ${{ inputs.service_account == '' && inputs.token_format == '' }}
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.gcp_project }}

    - name: WIF auth through a service account impersonation
      id: wif_auth_impersonation
      uses: google-github-actions/auth@v2
      if: ${{ inputs.service_account != '' && inputs.token_format == 'access_token' }}
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.gcp_project }}

    - name: WIF auth through impersonation with access token
      id: wif_auth_impersonation_access_token
      uses: google-github-actions/auth@v2
      if: ${{ inputs.service_account != '' && inputs.token_format == 'access_token' }}
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.gcp_project }}
        service_account: ${{ inputs.service_account }}
        token_format: ${{ inputs.token_format }}

    - name: WIF auth through impersonation with ID token
      id: wif_auth_impersonation_id_token
      uses: google-github-actions/auth@v2
      if: ${{ inputs.service_account != '' && inputs.token_format == 'id_token' }}
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.gcp_project }}
        service_account: ${{ inputs.service_account }}
        token_format: ${{ inputs.token_format }}
        id_token_audience: ${{ inputs.audience }}
