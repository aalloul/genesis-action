name: Publish actions

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate action definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.3"

      - name: Validate action.yml files
        run: |
          find . -name 'action.yml' -not -path './.git/*' | while read -r f; do
            echo "Validating $f"
            uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json "$f"
          done

  release:
    name: Release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release
        id: release
        uses: ./semantic-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
