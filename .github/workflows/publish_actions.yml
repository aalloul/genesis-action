name: Publish actions

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate action definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.3"

#      - name: Install check-jsonschema
#        run: uvx install check-jsonschema

      - name: Validate action.yml files
        run: |
          find . -name 'action.yml' -not -path './.git/*' | while read -r f; do
            echo "Validating $f"
            uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json "$f"
          done

  release:
    name: Release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major version tag
        if: github.ref == 'refs/heads/main' && steps.release.outputs.new_release_published == 'true'
        run: |
          MAJOR="v$(echo '${{ steps.release.outputs.new_release_version }}' | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
